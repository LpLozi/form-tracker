function estimateBodyFat(m){
 const waist=Number(m&&m.waist),neck=Number(m&&m.neck),height=Number((db.profile&&db.profile.height)||181);
 if(!waist||!neck||waist<=neck||!height)return null;
 const wi=waist/2.54,ni=neck/2.54,hi=height/2.54;
 const density=1.0324-0.19077*Math.log10(wi-ni)+0.15456*Math.log10(hi);
 const bf=495/density-450;
 return Number.isFinite(bf)&&bf>2&&bf<60?bf:null;
}
function fmtBF(v){return v==null?'—':fmt(v,1)+'%'}
function drawProgressChart(){
 const c=document.getElementById('progressChart');if(!c)return;
 const rows=[...db.measurements].filter(x=>x.date&&(x.weight||x.waist||estimateBodyFat(x)!=null)).sort((a,b)=>a.date.localeCompare(b.date));
 const ctx=c.getContext('2d'),rect=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
 c.width=rect.width*dpr;c.height=rect.height*dpr;ctx.scale(dpr,dpr);
 const W=rect.width,H=rect.height,p={l:38,r:14,t:16,b:30};
 ctx.clearRect(0,0,W,H);
 if(rows.length<2){ctx.fillStyle='#7b8494';ctx.font='13px sans-serif';ctx.fillText('Grafik için en az 2 ölçüm gerekli.',16,32);return;}
 const series=[
  {vals:rows.map(x=>Number(x.weight)||null),stroke:'#2563eb'},
  {vals:rows.map(x=>Number(x.waist)||null),stroke:'#0ea5a4'},
  {vals:rows.map(x=>estimateBodyFat(x)),stroke:'#d97706'}
 ];
 const all=series.flatMap(a=>a.vals.filter(v=>v!=null));let min=Math.min(...all),max=Math.max(...all);const pad=Math.max(2,(max-min)*.12);min-=pad;max+=pad;
 const xAt=i=>p.l+(W-p.l-p.r)*(i/(rows.length-1));const yAt=v=>p.t+(H-p.t-p.b)*(max-v)/(max-min||1);
 ctx.strokeStyle='#e8edf3';ctx.lineWidth=1;
 for(let i=0;i<5;i++){const y=p.t+(H-p.t-p.b)*i/4;ctx.beginPath();ctx.moveTo(p.l,y);ctx.lineTo(W-p.r,y);ctx.stroke();}
 series.forEach(sr=>{ctx.strokeStyle=sr.stroke;ctx.lineWidth=2.2;ctx.beginPath();let pen=false;sr.vals.forEach((v,i)=>{if(v==null){pen=false;return;}const x=xAt(i),y=yAt(v);if(!pen){ctx.moveTo(x,y);pen=true}else ctx.lineTo(x,y)});ctx.stroke();});
}

function estimateCardio(type,min,speed,incline,intensity){let met=5;const mult=intensity==='Hafif'?.8:intensity==='Yüksek'?1.25:1;if(type==='Yürüyüş')met=speed>=6?5:speed>=5?3.8:3.2;if(type==='Eğimli yürüyüş')met=5+Math.min(5,incline*.25)+(speed>=5.5?1:0);if(type==='Koşu')met=speed>=12?12:speed>=10?10:speed>=8?8.3:7;if(type==='Bisiklet')met=6.8;if(type==='Eliptik')met=5.5;if(type==='Kürek')met=7;if(type==='İp atlama')met=11.5;if(type.includes('Merdiven'))met=8.8;return Math.round(met*mult*3.5*currentWeight()/200*min)}

'Lat Pulldown':{rest:120,form:'Göğsü hafif yukarı kaldır. Barı boynun arkasına değil üst göğse doğru çek. Çekişi dirsekleri aşağı-cebe götürür gibi yap; belden aşırı geriye yatma.',load:'Orta-yüksek ağırlık. 6-10 tekrarda tam esneme ve lat kasılması korunmalı. Ağırlık uğruna yarım tekrar yapma.'},
'Machine Chest Press':{rest:120,form:'Omuzları geride ve aşağıda tut. Tutacakları göğüs orta hattına yakın konumdan it. Dirsekleri tamamen kilitlemeden kontrollü dön.',load:'Orta-yüksek ağırlık. 8-12 tekrar, RIR 1-2. Güvenli makine olduğu için son sette limite daha çok yaklaşabilirsin.'},
'Seated Cable Row':{rest:120,form:'Göğsü açık, omurgayı nötr tut. Tutacağı gövdene çekerken dirsekleri geriye sür, kürek kemiklerini sık. Dönüşte omuzları kontrollü öne uzat.',load:'Orta ağırlık. 8-12 tekrar. Momentum yerine tam germe-sıkma öncelikli.'},
'Cable Fly — Low to High':{rest:75,form:'Kabloları aşağıdan yukarı ve içeri doğru, üst göğüs hattına getir. Dirseklerde hafif sabit kırıklık tut. Omuzları öne yuvarlama.',load:'Düşük-orta ağırlık. 12-15 tekrar. Burada kilo kovalamıyoruz; üst göğüs hissi ve kontrollü negatif önemli.'},
'Cable / DB Lateral Raise':{rest:60,form:'Kolları yana kaldırırken dirsekleri hafif kır. Omuzları kulaklara çekme. Dirsekleri ellerden az önde tut ve omuz hizasının biraz üstüne çıkma.',load:'Düşük-orta ağırlık. 12-20 tekrar. Sallanma başlıyorsa ağırlık fazla. Yan omuzda yanma hedef.'},
'Triceps Pushdown':{rest:75,form:'Dirsekleri gövdeye sabitle. Sadece dirsek ekleminden aç. Altta tricepsi sık, dönüşte omuzları öne kaçırma.',load:'Orta ağırlık. 10-15 tekrar. Son sette RIR 0-1 kabul; form bozulursa kilo azalt.'},
'Cable / Biceps Curl':{rest:75,form:'Dirsekleri gövde yanında sabit tut. Omuzu öne taşıma. Tam açılmaya yakın esnet ve yukarıda bicepsi sık.',load:'Orta ağırlık. 10-15 tekrar. Salınım yok; son tekrarlar zor ama temiz olmalı.'},
'Back Squat':{rest:180,form:'Ayakları doğal açında yerleştir, nefes alıp karın içi basınç oluştur. Dizleri ayak yönünde takip ettir. Kalçayı kontrollü aşağı indir, gövdeyi sabit tut.',load:'Yüksek ama kontrollü ağırlık. 5-8 tekrar, RIR yaklaşık 2. Failure yok; teknik bozulmadan kuvvet üret.'},
'Leg Press':{rest:150,form:'Belini mindere sabitle. Dizleri ayaklarla aynı hatta indir. Kalçan minderden kalkacak kadar derine zorlama; üstte dizleri sert kilitleme.',load:'Orta-yüksek ağırlık. 8-12 tekrar. Tam ROM ve kontrollü negatif öncelikli.'},
'Romanian Deadlift':{rest:150,form:'Dizleri hafif kır, kalçayı geriye gönder. Bar/dambılları bacağa yakın tut. Bel nötr; hamstring gerilimi kaybolmadan aşağı in, kalçayı ileri sürerek kalk.',load:'Orta-yüksek ağırlık. 6-10 veya 8-10 tekrar. Bel yükleniyorsa ağırlığı azalt; hamstring gerilimi öncelik.'},
'Leg Curl':{rest:90,form:'Kalçayı pedden kaldırma. Topukları kalçaya doğru çekerken hamstringi sık. Dönüşü yavaş yap ve dizleri tam kontrol et.',load:'Orta ağırlık. 10-15 tekrar. Son sette RIR 1 civarı.'},
'Calf Raise':{rest:75,form:'Aşağıda topuğu kontrollü indirip baldırı tamamen esnet. Yukarıda parmak ucuna yükselip 1 saniye sık. Sekme yapma.',load:'Orta-yüksek ağırlık. 10-15 tekrar. Tam hareket açıklığı ağırlıktan daha önemli.'},
'Cable Crunch':{rest:60,form:'Kalçayı sabit tut. Gövdeyi kalçadan değil omurgadan kıvırarak kaburgaları pelvise yaklaştır. Boyundan çekme.',load:'Orta ağırlık. 10-15 tekrar. Karın kasını gerçekten kısaltabildiğin ağırlığı kullan.'},
'Neutral / Close Grip Lat Pulldown':{rest:120,form:'Nötr/dar tutuşla göğsü açık tut. Dirsekleri aşağı ve geriye çek. Üstte kolları kontrollü uzatıp latı esnet.',load:'Orta ağırlık. 8-12 tekrar. Tüm tekrarlar aynı mesafede olsun.'},
'Incline Dumbbell Press':{rest:150,form:'Bench açısını yaklaşık 20-35° tut. Kürek kemiklerini sabitle, dambılları üst göğüs hattına indir ve yukarı doğru kontrollü it.',load:'Orta-yüksek ağırlık. 8-12 tekrar, RIR 1-2. Dambılları dengeleyemiyorsan ağırlığı düşür.'},
'Chest Supported Row':{rest:120,form:'Göğsü desteğe sabitle. Omuzları kulaklara çekmeden dirsekleri geriye sür. Üstte kürek kemiklerini sık, dönüşte tam uzat.',load:'Orta-yüksek ağırlık. 8-12 tekrar. Gövde hareketi olmadığı için sırta temiz yük ver.'},
'Machine Shoulder Press':{rest:150,form:'Belini aşırı çukurlaştırma. Tutacakları kulak-omuz hizasından yukarı it. Dirsekleri tamamen kilitlemeden kontrollü indir.',load:'Orta-yüksek ağırlık. 8-12 tekrar, RIR 1-2. Omuz ekleminde rahatsızlık varsa daha nötr tutuş kullan.'},
'Single-Arm Cable Lat Pulldown':{rest:75,form:'Tek kolu yukarıda tamamen uzat. Dirseği kalçaya doğru çekerek latı kısalt. Gövdeyi döndürmeden çalış.',load:'Düşük-orta ağırlık. 10-15 tekrar. Lat hissi kayboluyorsa kilo fazla.'},
'Lateral Raise':{rest:60,form:'Kolu yana kaldır, omuzu yukarı silkme. Dirsek hafif kırık ve elden az önde olsun. Kontrollü indir.',load:'Düşük-orta ağırlık. 12-20 tekrar. Son sette RIR 0-1 olabilir; momentum minimum.'},
'Reverse Pec Deck':{rest:75,form:'Göğsü pede sabitle. Kolları geriye açarken omuzları yükseltme. Hareketi arka omuzdan başlat, kürekleri aşırı sıkıştırma.',load:'Düşük-orta ağırlık. 12-20 tekrar. Arka omuz hissi öncelik.'},
'Hammer Curl':{rest:75,form:'Avuçlar birbirine bakacak şekilde dirsekleri sabit tut. Dambılları salınım yapmadan kaldır, kontrollü indir.',load:'Orta ağırlık. 10-15 tekrar. Son tekrarlar zor olabilir ama gövde savrulmasın.'},
'Overhead Cable Triceps Extension':{rest:75,form:'Dirsekleri baş yanında sabit tut. Kabloyu baş arkasından uzatarak dirsekleri aç. Omuz hareketini minimumda tut.',load:'Düşük-orta ağırlık. 10-15 tekrar. Uzun başta esneme hissi hedef.'},
'Hack Squat / Leg Press':{rest:150,form:'Ayak ve diz hattını koru. Kontrollü derinliğe in, bel/pelvisi pedden koparma. Yukarı çıkarken dizleri içeri düşürme.',load:'Orta-yüksek ağırlık. 8-12 tekrar, RIR 1-2. Bacakta mekanik gerilim hedef.'},
'Bulgarian Split Squat':{rest:120,form:'Öndeki ayağı yeterince ileri yerleştir. Gövdeyi kontrollü indir, ön diz ayak yönünü takip etsin. Ağırlığı ön bacakta tut.',load:'Orta ağırlık. 8-12 tekrar/bacak. Denge bozuluyorsa önce ağırlığı değil tekniği düzelt.'},
'Seated / Lying Leg Curl':{rest:90,form:'Kalça ve gövdeyi pede sabitle. Dizden bükerek topuğu geriye çek, hamstringi sık ve dönüşü yavaş yap.',load:'Orta ağırlık. 10-15 tekrar, RIR 1.'},
'Hanging Knee / Leg Raise':{rest:60,form:'Barı sıkı tut, sallanmayı kes. Pelvisi posterior tilt yaparak dizleri/ayakları yukarı çek. Sadece kalça fleksörüyle savurma yapma.',load:'Vücut ağırlığı veya hafif ek yük. 10-15 tekrar. Kontrol bozulursa tekrar sayısını azalt.'}
};
function exerciseGuide(name){return exerciseGuides[name]||{rest:90,form:'Hareketi kontrollü tempo, tam hareket açıklığı ve ağrısız eklem pozisyonuyla uygula.',load:'Orta ağırlık kullan; hedef tekrar aralığında 1-2 tekrar yedekte kalacak şekilde ayarla.'}}
function exerciseVideoUrl(name){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(name+' exercise proper form')}

function normalizeExercise(e){return Array.isArray(e)?{name:e[0],sets:e[1],reps:e[2],rir:''}:e}
function prevSetsFor(last,name){const p=last?.exercises?.find(x=>x.name===name);if(!p)return[];if(Array.isArray(p.setData))return p.setData;if(p.reps){const reps=String(p.reps).split(',').map(x=>x.trim());return reps.map(r=>({weight:p.weight,reps:r,rir:p.rir}))}return[]}
function exerciseInput(raw,i,last){const e=normalizeExercise(raw);const g=exerciseGuide(e.name);const prev=prevSetsFor(last,e.name);const rows=Array.from({length:e.sets},(_,j)=>{const ps=prev[j]||{};return `<tr><td class="set-num">${j+1}</td><td class="prev-cell">${ps.weight||'-'} × ${ps.reps||'-'}</td><td><input id="kg_${i}_${j}" type="number" inputmode="decimal" step="0.5" placeholder="kg" value="${ps.weight||''}"></td><td><input id="rep_${i}_${j}" type="number" inputmode="numeric" step="1" placeholder="${e.reps}"></td><td><input id="rir_${i}_${j}" type="number" inputmode="decimal" step="0.5" placeholder="${e.rir||'-'}"></td><td class="set-done"><input id="done_${i}_${j}" type="checkbox" onchange="setCompleted('${e.name.replace(/'/g,"\'")}',${j+1},this)"></td></tr>`}).join('');return `<div class="workout-card"><div class="exercise-head"><div><strong style="font-size:17px">${e.name}</strong><div style="margin-top:5px"><span class="pill">${e.sets} set • ${e.reps} tekrar</span> <span class="pill">RIR ${e.rir||'-'}</span> <span class="pill">Dinlenme ~${Math.round(g.rest/60*10)/10} dk</span></div></div><button class="secondary small" onclick="addExtraSet(${i})">+ Set</button></div><div style="overflow-x:auto"><table class="set-table" id="settable_${i}"><thead><tr><th>SET</th><th>ÖNCEKİ</th><th>KG</th><th>TEKRAR</th><th>RIR</th><th>✓</th></tr></thead><tbody>${rows}</tbody></table></div><div class="form-guide"><details><summary>▶ Form rehberi & uygulama notu</summary><div class="guide-grid"><div class="guide-box"><b>Doğru form</b><div class="muted" style="margin-top:5px">${g.form}</div></div><div class="guide-box"><b>Nasıl yüklenmeli?</b><div class="muted" style="margin-top:5px">${g.load}</div></div></div><a class="secondary small video-link" href="${exerciseVideoUrl(e.name)}" target="_blank" rel="noopener">🎥 Video rehberi aç</a></details></div><input class="exercise-note" id="note_${i}" placeholder="Hareket notu (opsiyonel)"></div>`}

function addExtraSet(i){const tb=document.querySelector(`#settable_${i} tbody`);const j=tb.rows.length;const tr=document.createElement('tr');tr.innerHTML=`<td class="set-num">${j+1}</td><td class="prev-cell">- × -</td><td><input id="kg_${i}_${j}" type="number" inputmode="decimal" step="0.5" placeholder="kg"></td><td><input id="rep_${i}_${j}" type="number" inputmode="numeric" step="1" placeholder="tekrar"></td><td><input id="rir_${i}_${j}" type="number" inputmode="decimal" step="0.5" placeholder="RIR"></td><td class="set-done"><input id="done_${i}_${j}" type="checkbox" onchange="setCompleted('${normalizeExercise(db.program[window._wk][i]).name.replace(/\'/g,"\\\'")}',${j+1},this)"></td>`;tb.appendChild(tr)}

function setCompleted(exerciseName,setNo,el){if(!el.checked)return;const sec=exerciseGuide(exerciseName).rest;startRest(sec,exerciseName,setNo)}
function startRest(seconds,exerciseName,setNo){clearInterval(window._restInt);window._restEnd=Date.now()+seconds*1000;const box=document.getElementById('restBox');if(box)box.style.display='flex';const label=document.getElementById('restLabel');if(label)label.textContent=`${exerciseName} • ${setNo}. set sonrası`;updateRestTimer();window._restInt=setInterval(updateRestTimer,250)}
function updateRestTimer(){if(!window._restEnd)return;const left=Math.max(0,Math.ceil((window._restEnd-Date.now())/1000));const e=document.getElementById('restTimer');if(e)e.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;if(left<=0){clearInterval(window._restInt);window._restEnd=null;playRestSound();toast('Dinlenme bitti — sete girebilirsin');const b=document.getElementById('restBox');if(b)setTimeout(()=>b.style.display='none',1800)}}
function skipRest(){clearInterval(window._restInt);window._restEnd=null;const b=document.getElementById('restBox');if(b)b.style.display='none'}
function playRestSound(){try{const C=window.AudioContext||window.webkitAudioContext;const ctx=new C();const o=ctx.createOscillator();const g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(880,ctx.currentTime);g.gain.setValueAtTime(.18,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.45);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.45)}catch(e){}}

function saveWorkout(){if(!window._workoutStart){toast('Önce antrenmanı başlat');return}const type=window._wk;const ex=db.program[type].map((raw,i)=>{const e=normalizeExercise(raw);const count=document.querySelectorAll(`#settable_${i} tbody tr`).length;const setData=[];for(let j=0;j<count;j++){const kg=document.getElementById(`kg_${i}_${j}`)?.value;const reps=document.getElementById(`rep_${i}_${j}`)?.value;const rir=document.getElementById(`rir_${i}_${j}`)?.value;const done=document.getElementById(`done_${i}_${j}`)?.checked;if(kg||reps||done)setData.push({set:j+1,weight:kg?Number(kg):null,reps:reps?Number(reps):null,rir:rir?Number(rir):null,done:!!done})}return {name:e.name,sets:e.sets,repRange:e.reps,targetRir:e.rir,setData,note:document.getElementById(`note_${i}`)?.value||''}});const durationSec=elapsedSeconds();const cardio=cardioData();db.workouts.push({date:workoutDate.value,type,exercises:ex,durationSec,cardio});save();clearInterval(window._timerInt);clearInterval(window._restInt);window._restEnd=null;window._workoutStart=null;toast(`Antrenman kaydedildi • ${Math.round(durationSec/60)} dk${cardio?` • kardiyo ~${cardio.kcal} kcal`:''}`);renderWorkout()}
function renderMeasurements(){const rows=[...db.measurements].sort((a,b)=>b.date.localeCompare(a.date));app.innerHTML=`<div class="card"><h2>Yeni ölçüm</h2><div class="grid g4"><div><label>Tarih</label><input id="m_date" type="date" value="${today}"></div><div><label>Kilo (kg)</label><input id="m_weight" type="number" step="0.1"></div><div><label>Bel (cm)</label><input id="m_waist" type="number" step="0.1"></div><div><label>Göbek (cm)</label><input id="m_navel" type="number" step="0.1"></div><div><label>Boyun (cm)</label><input id="m_neck" type="number" step="0.1"></div><div><label>Göğüs (cm)</label><input id="m_chest" type="number" step="0.1"></div><div><label>Sağ kol (cm)</label><input id="m_armR" type="number" step="0.1"></div><div><label>Sol kol (cm)</label><input id="m_armL" type="number" step="0.1"></div><div><label>Sağ bacak (cm)</label><input id="m_thighR" type="number" step="0.1"></div><div><label>Sol bacak (cm)</label><input id="m_thighL" type="number" step="0.1"></div><div><label>Not</label><input id="m_note"></div><div style="align-self:end"><button class="primary" onclick="addMeasurement()">Kaydet</button></div></div></div>
<div class="card" style="margin-top:14px"><h2>Vücut değişim grafiği</h2><div class="muted">Kilo, bel çevresi ve tahmini yağ oranının zaman içindeki değişimi.</div><div class="chart-wrap"><canvas id="progressChart"></canvas></div><div class="chart-legend"><span style="color:#2563eb">● Kilo</span><span style="color:#0ea5a4">● Bel</span><span style="color:#d97706">● Tahmini yağ %</span></div><div class="bodyfat-note">Yağ oranı bel, boyun ve boy ölçülerinden US Navy formülüyle hesaplanan yaklaşık değerdir; klinik ölçüm değildir.</div></div><div class="card" style="margin-top:14px"><h2>Geçmiş</h2><div style="overflow:auto"><table class="table"><tr><th>Tarih</th><th>Kilo</th><th>Bel</th><th>Göbek</th><th>Boyun</th><th>Göğüs</th><th>Not</th></tr>${rows.map(r=>`<tr><td>${r.date}</td><td>${r.weight||'-'}</td><td>${r.waist||'-'}</td><td>${r.navel||'-'}</td><td>${r.neck||'-'}</td><td>${r.chest||'-'}</td><td>${r.note||''}</td></tr>`).join('')}</table></div></div>`;setTimeout(drawProgressChart,0)}
function addMeasurement(){const ids=['date','weight','waist','navel','neck','chest','armR','armL','thighR','thighL','note'];let o={};ids.forEach(k=>{let v=document.getElementById('m_'+k).value;o[k]=['date','note'].includes(k)?v:(v?Number(v):'')});db.measurements.push(o);save();toast('Ölçüm kaydedildi');renderMeasurements()}
function renderPhotos(){app.innerHTML=`<div class="card"><h2>Form fotoğrafı ekle</h2><div class="row"><div><label>Tarih</label><input id="p_date" type="date" value="${today}"></div><div><label>Poz</label><select id="p_pose"><option>Ön rahat</option><option>Ön poz</option><option>Sağ yan</option><option>Sol yan</option><option>Arka</option><option>Biceps</option><option>Tam boy</option></select></div><div><label>Fotoğraf</label><input id="p_file" type="file" accept="image/*"></div><div class="fit"><button class="primary" onclick="addPhoto()">Ekle</button></div></div><div class="muted" style="margin-top:8px">Fotoğraflar yalnızca bu cihazın tarayıcısında saklanır. Düzenli olarak yedek dışa aktar.</div></div><div class="photo-grid" style="margin-top:14px">${db.photos.slice().reverse().map((p,i)=>`<div class="card photo-card"><img src="${p.data}"><strong>${p.pose}</strong><div class="muted">${p.date}</div></div>`).join('')||'<div class="muted">Henüz fotoğraf yok.</div>'}</div>`}
function addPhoto(){const file=p_file.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{db.photos.push({date:p_date.value,pose:p_pose.value,data:r.result});save();toast('Fotoğraf eklendi');renderPhotos()};r.readAsDataURL(file)}
function renderSettings(){app.innerHTML=`<div class="grid g2"><div class="card"><h2>Hedefler</h2><div class="grid g2">${[['kcal','Kalori'],['protein','Protein (g)'],['carb','Karbonhidrat (g)'],['fat','Yağ (g)'],['fiber','Lif (g)'],['water','Su (L)']].map(([k,l])=>`<div><label>${l}</label><input id="t_${k}" type="number" value="${db.targets[k]}"></div>`).join('')}</div><button class="primary" style="margin-top:12px" onclick="saveTargets()">Hedefleri kaydet</button></div>
<div class="card"><h2>Yeni özel besin</h2><div class="grid g2"><div><label>Ad</label><input id="f_name"></div><div><label>Marka</label><input id="f_brand"></div><div><label>Standart porsiyon gramı</label><input id="f_serving" type="number" value="100"></div><div><label>Kalori /100g</label><input id="f_kcal" type="number"></div><div><label>Protein /100g</label><input id="f_protein" type="number"></div><div><label>Karbonhidrat /100g</label><input id="f_carb" type="number"></div><div><label>Yağ /100g</label><input id="f_fat" type="number"></div><div><label>Lif /100g</label><input id="f_fiber" type="number"></div></div><button class="primary" style="margin-top:12px" onclick="addCustomFood()">Besini ekle</button></div></div>
<div class="card" style="margin-top:14px"><h2>Yedekleme</h2><div class="row"><button class="secondary" onclick="exportData()">JSON yedeği indir</button><div><label>Yedeği geri yükle</label><input type="file" id="importFile" accept="application/json" onchange="importData(this.files[0])"></div><button class="danger" onclick="resetAll()">Tüm veriyi sıfırla</button></div><div class="muted" style="margin-top:10px">Sürüm ${APP_VERSION}. Veriler bu tarayıcıda saklanır.</div></div>`}
function saveTargets(){Object.keys(db.targets).forEach(k=>{const el=document.getElementById('t_'+k);if(el)db.targets[k]=Number(el.value)});save();toast('Hedefler kaydedildi')}
function addCustomFood(){db.foods.push({name:f_name.value||'Özel besin',brand:f_brand.value||'Özel',unit:'g',servingG:Number(f_serving.value)||100,kcal:Number(f_kcal.value)||0,protein:Number(f_protein.value)||0,carb:Number(f_carb.value)||0,fat:Number(f_fat.value)||0,fiber:Number(f_fiber.value)||0,sugar:0,sodium:0,potassium:0,calcium:0,iron:0,magnesium:0,vitC:0,vitD:0});save();toast('Özel besin eklendi')}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='FORM-yedek-'+today+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();toast('Yedek geri yüklendi');render()}catch(e){alert('Geçersiz yedek dosyası')}};r.readAsText(file)}
function resetAll(){if(confirm('Tüm kayıtlar silinecek. Emin misin?')){db=seed();save();render();toast('Sıfırlandı')}}
nav();render();
</script>
</body>
</html>
